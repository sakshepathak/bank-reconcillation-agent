[pytest]
# Only collect tests from tests/. This stops `pytest` (run with no arguments)
# from crawling data/ — the fastembed model cache, whose symlinked files
# Windows can't stat (WinError 1920) — so plain `pytest` just works.
testpaths = tests

# Belt-and-suspenders: never descend into these even if pointed at the root
# with `pytest .`.
norecursedirs = data .git frontend node_modules .venv venv *.egg-info __pycache__

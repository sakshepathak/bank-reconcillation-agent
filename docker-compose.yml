services:

  # ── Qdrant Vector Database ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bank_recon_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Ingestor — runs once to populate the KB, then exits ───────────────────
  ingest:
    build: .
    container_name: bank_recon_ingest
    command: python -m knowledge_base.ingest
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////app/data/bank_recon.db
      FASTEMBED_CACHE_PATH: /app/data/fastembed_cache
    volumes:
      - ./knowledge:/app/knowledge:ro
      - ./data:/app/data
      - ./mcp_server:/app/mcp_server:ro
      - ./knowledge_base:/app/knowledge_base:ro
      - ./config:/app/config:ro
      - ./memory:/app/memory:ro
    depends_on:
      - qdrant
    restart: "no"

  # ── MCP Server ─────────────────────────────────────────────────────────────
  mcp_server:
    build: .
    container_name: bank_recon_mcp
    command: python -m mcp_server.server
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////app/data/bank_recon.db
      FASTEMBED_CACHE_PATH: /app/data/fastembed_cache
    volumes:
      - ./data:/app/data
      - ./mcp_server:/app/mcp_server:ro
      - ./knowledge_base:/app/knowledge_base:ro
      - ./config:/app/config:ro
      - ./memory:/app/memory:ro
    depends_on:
      - qdrant
    restart: unless-stopped

  # ── Test runner ────────────────────────────────────────────────────────────
  tests:
    build: .
    container_name: bank_recon_tests
    command: python -m pytest tests/ -v --tb=short
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////app/data/test_bank_recon.db
      FASTEMBED_CACHE_PATH: /app/data/fastembed_cache
    volumes:
      - ./data:/app/data
      - ./mcp_server:/app/mcp_server:ro
      - ./knowledge_base:/app/knowledge_base:ro
      - ./config:/app/config:ro
      - ./memory:/app/memory:ro
      - ./tests:/app/tests:ro
    depends_on:
      - qdrant
    restart: "no"

  # ── FastAPI REST backend ───────────────────────────────────────────────────
  api:
    build: .
    container_name: bank_recon_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////app/data/bank_recon.db
      FASTEMBED_CACHE_PATH: /app/data/fastembed_cache
    volumes:
      - ./data:/app/data
      - ./api:/app/api:ro
      - ./memory:/app/memory:ro
      - ./engine:/app/engine:ro
      - ./mcp_server:/app/mcp_server:ro
      - ./knowledge_base:/app/knowledge_base:ro
      - ./config:/app/config:ro
    depends_on:
      - qdrant
    restart: unless-stopped

  # ── Streamlit UI (kept during React transition) ────────────────────────────
  ui:
    build: .
    container_name: bank_recon_ui
    command: streamlit run app/main.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////app/data/bank_recon.db
      FASTEMBED_CACHE_PATH: /app/data/fastembed_cache
    volumes:
      - ./data:/app/data
      - ./app:/app/app:ro
      - ./mcp_server:/app/mcp_server:ro
      - ./engine:/app/engine:ro
      - ./knowledge_base:/app/knowledge_base:ro
      - ./config:/app/config:ro
      - ./memory:/app/memory:ro
      - ./sample_data:/app/sample_data:ro
    depends_on:
      - qdrant
    restart: unless-stopped

  # ── React frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bank_recon_frontend
    ports:
      - "5173:5173"
    environment:
      # Proxy /api/* to the api container, not localhost
      VITE_API_TARGET: http://api:8000
    volumes:
      # Mount source for hot-reload in dev
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
